services:
  venice-openai-proxy:
    build:
      context: .
      args:
        # Written to .env by scripts/deploy.sh so /support/info reports the
        # commit the image was built from.
        VENICE_BUILD_COMMIT: "${VENICE_BUILD_COMMIT:-}"
        VENICE_BUILD_BRANCH: "${VENICE_BUILD_BRANCH:-}"
    container_name: venice-openai-proxy
    ports:
      - "3456:3456"
    environment:
      VENICE_EMAIL: ${VENICE_EMAIL}
      VENICE_PASSWORD: ${VENICE_PASSWORD}
      VENICE_SESSION_FILE: /data/.venice-web-session.json
    volumes:
      - /path/to/venice-session:/data
    restart: unless-stopped
